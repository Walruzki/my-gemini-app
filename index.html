<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pocket Gemini</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .pin-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .output-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 200px;
      max-height: 55vh;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .output-box.active {
      color: var(--text);
    }

    .output-box.error {
      color: var(--error);
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    textarea {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      font-size: 1rem;
      resize: none;
      outline: none;
      height: 90px;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    button.send-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button.send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Pocket Gemini</h1>
      <button class="pin-btn" onclick="resetPin()">Change PIN</button>
    </header>

    <div id="responseBox" class="output-box">Ready.</div>

    <div class="input-section">
      <textarea id="promptInput" placeholder="Ask anything..."></textarea>
      <button id="sendBtn" class="send-btn" onclick="handleSend()">Send Prompt</button>
    </div>
  </div>

  <script>
    function getStoredPin() {
      let pin = localStorage.getItem("pocket_gemini_pin");
      if (!pin) {
        pin = prompt("Enter your 4-digit App PIN:");
        if (pin) {
          localStorage.setItem("pocket_gemini_pin", pin.trim());
        }
      }
      return pin;
    }

    function resetPin() {
      const newPin = prompt("Enter new PIN:");
      if (newPin) {
        localStorage.setItem("pocket_gemini_pin", newPin.trim());
        alert("PIN updated.");
      }
    }

    async function handleSend() {
      const input = document.getElementById("promptInput");
      const responseBox = document.getElementById("responseBox");
      const sendBtn = document.getElementById("sendBtn");

      const pin = getStoredPin();
      if (!pin) {
        alert("A PIN is required to use this application.");
        return;
      }

      const promptText = input.value.trim();
      if (!promptText) return;

      sendBtn.disabled = true;
      sendBtn.innerText = "Thinking...";
      responseBox.className = "output-box active";
      responseBox.innerText = "Processing...";

      try {
        const res = await fetch("/.netlify/functions/gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: promptText, pin: pin }),
        });

        const data = await res.json();

        if (res.status === 401) {
          localStorage.removeItem("pocket_gemini_pin");
          throw new Error("Invalid PIN. Please tap Send Prompt again to re-enter.");
        }

        if (!res.ok) {
          throw new Error(data.error || "Request failed");
        }

        responseBox.innerText = data.text;
        input.value = "";
      } catch (err) {
        responseBox.className = "output-box error";
        responseBox.innerText = `Error: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "Send Prompt";
      }
    }
  </script>
</body>
</html>
