<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pocket Gemini</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 12px 0 4px 0;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .output-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 200px;
      max-height: 55vh;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .output-box.active {
      color: var(--text);
    }

    .output-box.error {
      color: var(--error);
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    textarea {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      font-size: 1rem;
      resize: none;
      outline: none;
      height: 90px;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Pocket Gemini</h1>
    </header>

    <div id="responseBox" class="output-box">Ask a question to test the live connection...</div>

    <div class="input-section">
      <textarea id="promptInput" placeholder="Ask anything..."></textarea>
      <button id="sendBtn" onclick="handleSend()">Send Prompt</button>
    </div>
  </div>

  <script>
    async function handleSend() {
      const input = document.getElementById("promptInput");
      const responseBox = document.getElementById("responseBox");
      const sendBtn = document.getElementById("sendBtn");

      const promptText = input.value.trim();
      if (!promptText) return;

      // Update UI state
      sendBtn.disabled = true;
      sendBtn.innerText = "Gemini is thinking...";
      responseBox.className = "output-box active";
      responseBox.innerText = "Analyzing your request...";

      try {
        // Send request to your Netlify serverless function
        const res = await fetch("/.netlify/functions/gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: promptText }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Failed to get response");
        }

        responseBox.innerText = data.text;
        input.value = "";
      } catch (err) {
        responseBox.className = "output-box error";
        responseBox.innerText = `Error: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "Send Prompt";
      }
    }
  </script>
</body>
</html>
