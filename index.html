<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pocket Gemini</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2563eb;
      --user-bubble: #1d4ed8;
      --ai-bubble: #1e293b;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 12px;
      gap: 10px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .header-btns {
      display: flex;
      gap: 6px;
    }

    .btn-sm {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .bubble {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background-color: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .bubble.model {
      align-self: flex-start;
      background-color: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    .bubble.status {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .preview-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }

    .preview-bar img {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
    }

    .preview-bar button {
      background: none;
      border: none;
      color: var(--error);
      cursor: pointer;
      font-size: 0.85rem;
      margin-left: auto;
    }

    .input-section {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    textarea {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      color: var(--text);
      font-size: 0.95rem;
      resize: none;
      outline: none;
      height: 48px;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .attach-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }

    button.send-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      height: 44px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button.send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Pocket Gemini</h1>
      <div class="header-btns">
        <button class="btn-sm" onclick="clearConversation()">Clear</button>
        <button class="btn-sm" onclick="resetPin()">PIN</button>
      </div>
    </header>

    <div id="chatLog" class="chat-log">
      <div class="bubble model">Ready. You can type a prompt or attach a photo to analyze.</div>
    </div>

    <!-- Hidden native file picker for photo/camera -->
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelected(event)" />

    <!-- Attachment thumbnail preview -->
    <div id="previewContainer" class="preview-bar" style="display: none;">
      <img id="previewImg" src="" alt="Thumbnail" />
      <span>Image ready to send</span>
      <button onclick="removeAttachedImage()">✕ Remove</button>
    </div>

    <div class="input-section">
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach Photo">📷</button>
      <textarea id="promptInput" placeholder="Message or prompt..."></textarea>
      <button id="sendBtn" class="send-btn" onclick="handleSend()">Send</button>
    </div>
  </div>

  <script>
    let conversationHistory = [];
    let currentImagePayload = null;

    function getStoredPin() {
      let pin = localStorage.getItem("pocket_gemini_pin");
      if (!pin) {
        pin = prompt("Enter your 4-digit App PIN:");
        if (pin) localStorage.setItem("pocket_gemini_pin", pin.trim());
      }
      return pin;
    }

    function resetPin() {
      const newPin = prompt("Enter new PIN:");
      if (newPin) {
        localStorage.setItem("pocket_gemini_pin", newPin.trim());
        alert("PIN updated.");
      }
    }

    function clearConversation() {
      conversationHistory = [];
      removeAttachedImage();
      const log = document.getElementById("chatLog");
      log.innerHTML = '<div class="bubble model">Chat cleared. Ready for a new topic.</div>';
    }

    function appendBubble(role, text) {
      const log = document.getElementById("chatLog");
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.innerText = text;
      log.appendChild(bubble);
      log.scrollTop = log.scrollHeight;
      return bubble;
    }

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const fullBase64 = e.target.result;
        const [meta, rawBase64] = fullBase64.split(",");
        const mimeType = meta.match(/:(.*?);/)[1];

        currentImagePayload = {
          mimeType: mimeType,
          data: rawBase64
        };

        document.getElementById("previewImg").src = fullBase64;
        document.getElementById("previewContainer").style.display = "flex";
      };
      reader.readAsDataURL(file);
    }

    function removeAttachedImage() {
      currentImagePayload = null;
      document.getElementById("fileInput").value = "";
      document.getElementById("previewContainer").style.display = "none";
    }

    async function handleSend() {
      const input = document.getElementById("promptInput");
      const sendBtn = document.getElementById("sendBtn");
      const promptText = input.value.trim();

      if (!promptText && !currentImagePayload) return;

      const pin = getStoredPin();
      if (!pin) return;

      const displayText = promptText || (currentImagePayload ? "[Analyzing Attached Image]" : "");
      appendBubble("user", displayText);
      input.value = "";

      const userTextPayload = promptText || "Analyze this image concisely.";
      conversationHistory.push({
        role: "user",
        parts: [{ text: userTextPayload }]
      });

      sendBtn.disabled = true;
      const statusBubble = appendBubble("status", "Gemini is analyzing...");

      const imageToSend = currentImagePayload;
      removeAttachedImage();

      try {
        const res = await fetch("/api/gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            history: conversationHistory,
            image: imageToSend,
            pin: pin
          })
        });

        const data = await res.json();
        statusBubble.remove();

        if (res.status === 401) {
          localStorage.removeItem("pocket_gemini_pin");
          conversationHistory.pop();
          throw new Error("Invalid PIN. Tap Send to re-enter.");
        }

        if (!res.ok) {
          conversationHistory.pop();
          throw new Error(data.error || "Failed to reach Gemini");
        }

        appendBubble("model", data.text);
        conversationHistory.push({
          role: "model",
          parts: [{ text: data.text }]
        });

      } catch (err) {
        statusBubble.remove();
        appendBubble("status", `Error: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
