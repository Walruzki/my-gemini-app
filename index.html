<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pocket Gemini</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2563eb;
      --user-bubble: #1d4ed8;
      --ai-bubble: #1e293b;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 12px;
      gap: 10px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .header-btns {
      display: flex;
      gap: 6px;
    }

    .btn-sm {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .bubble {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background-color: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .bubble.model {
      align-self: flex-start;
      background-color: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    .bubble.status {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .input-section {
      display: flex;
      gap: 8px;
      padding-top: 4px;
    }

    textarea {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      color: var(--text);
      font-size: 0.95rem;
      resize: none;
      outline: none;
      height: 48px;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    button.send-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button.send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Pocket Gemini</h1>
      <div class="header-btns">
        <button class="btn-sm" onclick="clearConversation()">Clear</button>
        <button class="btn-sm" onclick="resetPin()">PIN</button>
      </div>
    </header>

    <div id="chatLog" class="chat-log">
      <div class="bubble model">Hello! I am ready. What are we working on?</div>
    </div>

    <div class="input-section">
      <textarea id="promptInput" placeholder="Type a message..."></textarea>
      <button id="sendBtn" class="send-btn" onclick="handleSend()">Send</button>
    </div>
  </div>

  <script>
    let conversationHistory = [];

    function getStoredPin() {
      let pin = localStorage.getItem("pocket_gemini_pin");
      if (!pin) {
        pin = prompt("Enter your 4-digit App PIN:");
        if (pin) localStorage.setItem("pocket_gemini_pin", pin.trim());
      }
      return pin;
    }

    function resetPin() {
      const newPin = prompt("Enter new PIN:");
      if (newPin) {
        localStorage.setItem("pocket_gemini_pin", newPin.trim());
        alert("PIN updated.");
      }
    }

    function clearConversation() {
      conversationHistory = [];
      const log = document.getElementById("chatLog");
      log.innerHTML = '<div class="bubble model">Chat cleared. Ready for a new topic.</div>';
    }

    function appendBubble(role, text) {
      const log = document.getElementById("chatLog");
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.innerText = text;
      log.appendChild(bubble);
      log.scrollTop = log.scrollHeight;
      return bubble;
    }

    async function handleSend() {
      const input = document.getElementById("promptInput");
      const sendBtn = document.getElementById("sendBtn");
      const promptText = input.value.trim();
      if (!promptText) return;

      const pin = getStoredPin();
      if (!pin) return;

      appendBubble("user", promptText);
      input.value = "";

      conversationHistory.push({
        role: "user",
        parts: [{ text: promptText }]
      });

      sendBtn.disabled = true;
      const statusBubble = appendBubble("status", "Gemini is typing...");

      try {
        const endpoint = `/api/gemini`;
        const res = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            history: conversationHistory,
            pin: pin
          })
        });

        const data = await res.json();
        statusBubble.remove();

        if (res.status === 401) {
          localStorage.removeItem("pocket_gemini_pin");
          conversationHistory.pop();
          throw new Error("Invalid PIN. Tap Send to re-enter.");
        }

        if (!res.ok) {
          conversationHistory.pop();
          throw new Error(data.error || "Failed to reach Gemini");
        }

        appendBubble("model", data.text);
        conversationHistory.push({
          role: "model",
          parts: [{ text: data.text }]
        });

      } catch (err) {
        statusBubble.remove();
        appendBubble("status", `Error: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
